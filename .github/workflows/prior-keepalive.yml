name: prior-keepalive
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Download sing-box
        run: |
          curl -fsSL -o sb.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz
          tar xzf sb.tar.gz
          cp sing-box-1.14.3-linux-amd64/sing-box ./sing-box
      - name: Write client config
        env:
          PW: ${{ secrets.PRIOR_HY2_PW }}
        run: |
          cat > client.json << EOF
          {
            "log": { "level": "warn" },
            "inbounds": [ { "type": "socks", "listen": "127.0.0.1", "listen_port": 11080 } ],
            "outbounds": [
              { "type": "hysteria2", "tag": "hy2", "server": "sg.priornetwork.com", "server_port": 19502, "password": "$PW", "tls": { "enabled": true, "server_name": "www.bing.com", "alpn": ["h3"], "insecure": true } },
              { "type": "direct", "tag": "direct" }
            ],
            "route": { "final": "hy2" }
          }
          EOF
          ./sing-box check -c client.json
      - name: HY2 exit check (expect 112.200.196.70)
        run: |
          ./sing-box run -c client.json > sb.log 2>&1 &
          sleep 3
          IP=""
          for i in 1 2 3; do
            IP=$(curl -s --max-time 20 -x socks5h://127.0.0.1:11080 https://api.ipify.org || true)
            [ -n "$IP" ] && break
            sleep 5
          done
          echo "exit ip: $IP"
          if [ "$IP" != "112.200.196.70" ]; then
            echo "HY2 CHECK FAILED (expected 112.200.196.70, got '$IP')"
            tail -20 sb.log || true
            exit 1
          fi
          echo "HY2 OK"
      - name: Minecraft status ping (players online)
        run: |
          pip install --quiet mcstatus
          python3 - << 'PY'
          from mcstatus import JavaServer
          s = JavaServer.lookup("sg2.priornetwork.com:24481").status()
          print("players online:", s.players.online, "/", s.players.max, "| latency ms:", round(s.latency, 1))
          assert s.players.online >= 1, "no players online - keepalive bots down?"
          print("MC OK")
          PY
