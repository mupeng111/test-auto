name: axent-hourly-claim
on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install chromium --with-deps

      - name: setup sing-box proxy
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          if [ -z "$PROXY_URL" ]; then
            echo "PROXY_URL secret not set, skipping proxy setup"
            exit 0
          fi
          SB_VER=1.11.4
          curl -sL -o sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar xzf sb.tar.gz
          node setup-proxy.mjs > sb-config.json
          ./sing-box-${SB_VER}-linux-amd64/sing-box run -c sb-config.json &
          echo "waiting for proxy port..."
          node -e "
            const net = require('net');
            const check = (retries) => {
              const s = net.createConnection(1080, '127.0.0.1');
              s.on('connect', () => { s.destroy(); process.exit(0); });
              s.on('error', () => {
                if (retries <= 0) process.exit(1);
                setTimeout(() => check(retries - 1), 1000);
              });
            };
            check(20);
          "
          echo "PROXY_SERVER=socks5://127.0.0.1:1080" >> $GITHUB_ENV

      - name: claim credits
        env:
          AXENT_COOKIES: ${{ secrets.AXENT_COOKIES }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: node claim.mjs
