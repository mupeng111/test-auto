name: axent-hourly-claim
on:
  schedule:
    - cron: '0 * * * *' # 每小时定时执行一次
  workflow_dispatch:      # 允许手动在网页端触发

concurrency:
  group: axent-hourly-claim
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    timeout-minutes: 30
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 运行环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装项目依赖包
        run: npm install

      - name: 安装 Playwright Chromium 浏览器及系统依赖
        run: npx playwright install chromium --with-deps

      - name: 配置并启动 sing-box 本地代理
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          if [ -z "$PROXY_URL" ]; then
            echo "PROXY_URL secret not set, skipping proxy setup"
            exit 0
          fi
          SB_VER=1.12.0
          curl -sL -o sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar xzf sb.tar.gz
          node setup-proxy.mjs > sb-config.json

          ./sing-box-${SB_VER}-linux-amd64/sing-box run -c sb-config.json > sing-box.log 2>&1 &
          
          echo "waiting for proxy port..."
          node -e "
            const net = require('net');
            const check = (retries) => {
              const s = net.createConnection(1080, '127.0.0.1');
              s.on('connect', () => { s.destroy(); process.exit(0); });
              s.on('error', () => {
                if (retries <= 0) process.exit(1);
                setTimeout(() => check(retries - 1), 1000);
              });
            };
            check(20);
          "

          echo "Testing proxy connection to external network..."
          if curl -s -m 10 --socks5 127.0.0.1:1080 https://api.ipify.org; then
            echo -e "\nProxy connection successful!"
            echo "PROXY_SERVER=socks5://127.0.0.1:1080" >> $GITHUB_ENV
          else
            echo -e "\nProxy connection failed! sing-box log:"
            cat sing-box.log
            exit 1
          fi

      - name: 启动虚拟桌面并执行领取脚本
        env:
          AXENT_COOKIES: ${{ secrets.AXENT_COOKIES }}
          AXENT_LOCAL_STORAGE: ${{ secrets.AXENT_LOCAL_STORAGE }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi
          xvfb-run -a node claim.mjs

      - name: 自动持久化回写最新的登录凭据
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT not set, skipping secret refresh"
            exit 0
          fi
          COOKIE_STATUS="skipped (no file)"
          STORAGE_STATUS="skipped (no file)"
          if [ -f fresh-cookies.json ]; then
            if gh secret set AXENT_COOKIES --repo ${{ github.repository }} < fresh-cookies.json; then
              COOKIE_STATUS="updated"
            else
              COOKIE_STATUS="FAILED"
              echo "::warning::failed to refresh AXENT_COOKIES"
            fi
          fi
          if [ -f fresh-localstorage.json ]; then
            if gh secret set AXENT_LOCAL_STORAGE --repo ${{ github.repository }} < fresh-localstorage.json; then
              STORAGE_STATUS="updated"
            else
              STORAGE_STATUS="FAILED"
              echo "::warning::failed to refresh AXENT_LOCAL_STORAGE"
            fi
          fi
          rm -f fresh-cookies.json fresh-localstorage.json
          echo "Refresh summary: AXENT_COOKIES=$COOKIE_STATUS, AXENT_LOCAL_STORAGE=$STORAGE_STATUS"

      - name: 上传异常排查截图制品
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-debug-screenshots
          path: screenshots/
          retention-days: 1

      - name: 自动清理历史构建运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in $(gh api "repos/${{ github.repository }}/actions/workflows/claim.yml/runs?per_page=100" --jq '.workflow_runs[].id'); do
            if [ "$run_id" != "${{ github.run_id }}" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" || true
            fi
          done

      - name: 任务失败时发送 Telegram 告警
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set, skip failure notification"
            exit 0
          fi
          MSG="❌【Axent 自动领取任务执行失败】
          ━━━━━━━━━━━━━━━━━━━━
          📌 工作流：${{ github.workflow }}
          🔢 运行批次：第 #${{ github.run_number }} 次运行
          ⚡ 触发事件：${{ github.event_name }}
          📁 仓库：${{ github.repository }}
          🔗 查看详情与日志：
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}")
          echo "Telegram response: ${RESP}"
