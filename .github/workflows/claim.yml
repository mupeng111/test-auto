name: axent-hourly-claim
on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

concurrency:
  group: axent-hourly-claim
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install chromium --with-deps

      - name: setup sing-box proxy
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          if [ -z "$PROXY_URL" ]; then
            echo "PROXY_URL secret not set, skipping proxy setup"
            exit 0
          fi
          SB_VER=1.11.4
          curl -sL -o sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar xzf sb.tar.gz
          node setup-proxy.mjs > sb-config.json

          ./sing-box-${SB_VER}-linux-amd64/sing-box run -c sb-config.json > sing-box.log 2>&1 &
          
          echo "waiting for proxy port..."
          node -e "
            const net = require('net');
            const check = (retries) => {
              const s = net.createConnection(1080, '127.0.0.1');
              s.on('connect', () => { s.destroy(); process.exit(0); });
              s.on('error', () => {
                if (retries <= 0) process.exit(1);
                setTimeout(() => check(retries - 1), 1000);
              });
            };
            check(20);
          "

          echo "Testing proxy connection to external network..."
          if curl -s -m 10 --socks5 127.0.0.1:1080 https://api.ipify.org; then
            echo -e "\nProxy connection successful!"
            echo "PROXY_SERVER=socks5://127.0.0.1:1080" >> $GITHUB_ENV
          else
            echo -e "\nProxy connection failed! sing-box log:"
            cat sing-box.log
            exit 1
          fi

      - name: claim credits
        env:
          AXENT_COOKIES: ${{ secrets.AXENT_COOKIES }}
          AXENT_LOCAL_STORAGE: ${{ secrets.AXENT_LOCAL_STORAGE }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: node claim.mjs

      - name: Refresh login secrets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT not set, skip"
            exit 0
          fi
          if [ -f fresh-cookies.json ]; then
            gh secret set AXENT_COOKIES --repo ${{ github.repository }} < fresh-cookies.json
          fi
          if [ -f fresh-localstorage.json ]; then
            gh secret set AXENT_LOCAL_STORAGE --repo ${{ github.repository }} < fresh-localstorage.json
          fi
          rm -f fresh-cookies.json fresh-localstorage.json

      - name: upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-debug-screenshots
          path: screenshots/
          retention-days: 1

      - name: Cleanup old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in $(gh api "repos/${{ github.repository }}/actions/workflows/claim.yml/runs?per_page=100" --jq '.workflow_runs[].id'); do
            if [ "$run_id" != "${{ github.run_id }}" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" || true
            fi
          done

